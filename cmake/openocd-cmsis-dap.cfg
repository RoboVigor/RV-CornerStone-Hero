# OpenOCD config: CMSIS-DAP (DAPLink / WCH-Link in DAP mode / etc.) over SWD -> STM32F427II
#   openocd -f cmake/openocd-cmsis-dap.cfg -c "program build/infantry.elf verify reset exit"
# Several probes attached? Pick one with:  -c "cmsis_dap_serial <serial>"  before -f.
source [find interface/cmsis-dap.cfg]
transport select swd

# 2 MHz is conservative for flying leads on a robot; raise to 4000+ if the wiring is short.
adapter speed 2000

source [find target/stm32f4x.cfg]

# Default reset is SYSRESETREQ (SWDIO/SWCLK only). If NRST is wired to the probe and the
# chip won't connect (e.g. firmware disables SWD pins / sleeps), uncomment:
# reset_config srst_only srst_nogate connect_assert_srst
